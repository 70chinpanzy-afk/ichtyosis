name: Daily Ichthyosis Curation

on:
  schedule:
    # 毎朝7時 JST（UTC 22:00 前日）
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run curation (fetch → AI → LINE notify)
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FRONTEND_URL: https://ichtyosis.vercel.app
          CURATOR_PUBMED_EMAIL: ${{ secrets.CURATOR_PUBMED_EMAIL }}
        run: PYTHONPATH=. python -m ichthyosis_curator --verbose

      - name: Post to Bluesky
        working-directory: backend
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          PYTHONPATH=. python -c "
          from ichthyosis_curator.db import get_articles_by_date, get_digest_dates
          from ichthyosis_curator.delivery.bluesky_posting import post_to_bluesky
          from ichthyosis_curator.config import CuratorConfig
          config = CuratorConfig()
          dates = get_digest_dates(config.db_path, limit=1)
          if dates:
              articles = get_articles_by_date(config.db_path, dates[0])
              post_to_bluesky(articles)
          " || echo "Bluesky posting skipped or failed (non-fatal)"

      - name: Export to frontend
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PYTHONPATH=. python -m ichthyosis_curator --export ../frontend/public/data
          echo "=== Export results ==="
          cat ../frontend/public/data/digests.json | head -20
          ls -la ../frontend/public/data/digests/ | tail -5

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          echo "=== Files changed ==="
          git diff --cached --stat
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "daily: $(date +%Y-%m-%d) curated articles"
          # Retry push with rebase in case of concurrent commits
          for i in 1 2 3; do
            git push && break
            echo "Push failed (attempt $i), pulling with rebase..."
            git pull --rebase origin main
          done
