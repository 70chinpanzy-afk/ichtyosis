name: Daily Ichthyosis Curation

on:
  schedule:
    # 毎朝7時 JST（UTC 22:00 前日）
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run curation (fetch → AI → LINE notify)
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FRONTEND_URL: https://ichtyosis.vercel.app
          CURATOR_PUBMED_EMAIL: ${{ secrets.CURATOR_PUBMED_EMAIL }}
        run: PYTHONPATH=. python -m ichthyosis_curator --verbose

      - name: Post to X (Twitter)
        working-directory: backend
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          PYTHONPATH=. python -c "
          from ichthyosis_curator.db import get_articles_by_date, get_digest_dates
          from ichthyosis_curator.delivery.x_posting import post_to_x
          from ichthyosis_curator.config import CuratorConfig
          config = CuratorConfig()
          dates = get_digest_dates(config.db_path, limit=1)
          if dates:
              articles = get_articles_by_date(config.db_path, dates[0])
              post_to_x(articles)
          " || echo "X posting skipped or failed (non-fatal)"

      - name: Export to frontend
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: PYTHONPATH=. python -m ichthyosis_curator --export ../frontend/public/data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "daily: $(date +%Y-%m-%d) curated articles"
          git push
