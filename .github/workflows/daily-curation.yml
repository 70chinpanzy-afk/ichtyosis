name: Daily Ichthyosis Curation

on:
  schedule:
    # 毎朝7時 JST（UTC 22:00 前日）
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Debug env var lengths
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          echo "TOKEN length: ${#LINE_CHANNEL_ACCESS_TOKEN}"
          echo "USER_ID length: ${#LINE_USER_ID}"
          echo "USER_ID first 3 chars: ${LINE_USER_ID:0:3}"

      - name: Run curation (fetch → AI → LINE notify)
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FRONTEND_URL: https://sales-copilot-hdpqo2qwp-naoya-enomotos-projects.vercel.app
          CURATOR_PUBMED_EMAIL: ${{ secrets.CURATOR_PUBMED_EMAIL }}
        run: PYTHONPATH=. python -m ichthyosis_curator --verbose

      - name: Export to frontend
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: PYTHONPATH=. python -m ichthyosis_curator --export ../frontend/public/data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily curation update $(date +%Y-%m-%d)"
          git push
